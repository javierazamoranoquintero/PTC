services:
  app:
    build: .
    container_name: ptc-server
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: ptc-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ptc_data:/var/lib/postgresql/data

volumes:
  ptc_data: